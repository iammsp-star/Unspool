name: unspool
description: "A cross-platform digital wellbeing application to curb short-form video addiction."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core & Auth
  firebase_core: ^2.27.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.16.0
  
  # Third-Party Integrations
  google_sign_in: ^6.2.1
  
  # State Management (Provider chosen for this architecture)
  provider: ^6.1.2
  
  # Desktop Native & Window Management
  win32: ^5.2.0
  native_context_menu: ^0.1.3
  
  # UI/UX Utilities
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  custom_lint: ^0.6.2

flutter:
  uses-material-design: true
